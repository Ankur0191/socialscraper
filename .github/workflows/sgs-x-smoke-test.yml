name: SGS X API smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sgs-x-smoke-test.yml"

permissions:
  contents: read

jobs:
  sgs-x-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check X API access and fetch five recent SGS posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("X_BEARER_TOKEN", "").strip()
          if not token:
              print("FAIL: GitHub Actions secret X_BEARER_TOKEN is not configured.")
              sys.exit(2)

          base = "https://api.x.com/2"
          headers = {"Authorization": "Bearer " + token, "Accept": "application/json"}
          def get(path, params=None):
              url = base + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      detail = json.loads(body).get("detail") or json.loads(body).get("title") or "request rejected"
                  except Exception:
                      detail = "request rejected"
                  print(f"X API request failed: HTTP {exc.code}: {str(detail)[:300]}")
                  sys.exit(3)

          user_payload = get("/users/by/username/SGS_SA", {"user.fields": "id,name,username,verified,public_metrics"})
          user = user_payload.get("data")
          if not user:
              print("FAIL: X API did not return a user record for SGS_SA.")
              sys.exit(4)

          posts_payload = get("/users/" + urllib.parse.quote(str(user["id"]), safe="") + "/tweets", {
              "max_results": 5,
              "exclude": "retweets",
              "tweet.fields": "id,text,created_at,lang,public_metrics"
          })
          posts = posts_payload.get("data") or []
          result = {
              "tested_at": datetime.now(timezone.utc).isoformat(),
              "source": "official X API v2",
              "account_lookup": {"id": str(user["id"]), "name": user.get("name"), "username": user.get("username")},
              "posts_returned": len(posts),
              "posts": [{
                  "id": str(p.get("id", "")),
                  "url": "https://x.com/" + user.get("username", "SGS_SA") + "/status/" + str(p.get("id", "")),
                  "created_at": p.get("created_at"),
                  "text": p.get("text", ""),
                  "lang": p.get("lang"),
                  "public_metrics": p.get("public_metrics", {})
              } for p in posts]
          }
          os.makedirs("output", exist_ok=True)
          with open("output/sgs_x_last5.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          print(f"PASS: X API access succeeded for @{user.get('username')}; returned {len(posts)} post(s).")
          for i, post in enumerate(result["posts"], 1):
              print(f"{i}. {post.get('created_at') or 'timestamp unavailable'} | {post['url']}")
          if not posts:
              print("NOTE: API access worked, but no posts were returned for this endpoint/account.")
          PY

      - name: Upload SGS posts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgs-x-smoke-test
          path: output/sgs_x_last5.json
          if-no-files-found: ignore
          retention-days: 3
